<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Heart Shape Background - Dark -->
  <path d="M50 88 C 20 60 5 45 5 28 C 5 12 18 2 32 2 C 40 2 46 6 50 14 C 54 6 60 2 68 2 C 82 2 95 12 95 28 C 95 45 80 60 50 88 Z" fill="#111827" stroke="url(#grad)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Film Strip Elements (Stylized sprocket holes) -->
  <g fill="url(#grad)">
    <!-- Left Curve -->
    <rect x="18" y="15" width="6" height="4" rx="1" transform="rotate(-20 21 17)" />
    <rect x="14" y="25" width="6" height="4" rx="1" transform="rotate(-10 17 27)" />
    <rect x="13" y="35" width="6" height="4" rx="1" />
    <rect x="15" y="45" width="6" height="4" rx="1" transform="rotate(10 18 47)" />
    <rect x="20" y="55" width="6" height="4" rx="1" transform="rotate(25 23 57)" />
    <rect x="28" y="65" width="6" height="4" rx="1" transform="rotate(35 31 67)" />
    
    <!-- Right Curve -->
    <rect x="76" y="15" width="6" height="4" rx="1" transform="rotate(20 79 17)" />
    <rect x="80" y="25" width="6" height="4" rx="1" transform="rotate(10 83 27)" />
    <rect x="81" y="35" width="6" height="4" rx="1" />
    <rect x="79" y="45" width="6" height="4" rx="1" transform="rotate(-10 82 47)" />
    <rect x="74" y="55" width="6" height="4" rx="1" transform="rotate(-25 77 57)" />
    <rect x="66" y="65" width="6" height="4" rx="1" transform="rotate(-35 69 67)" />
  </g>

  <!-- Central Play Button / Heart Core -->
   <path d="M42 35 L 62 48 L 42 61 Z" fill="url(#grad)" rx="2" />

</svg>
